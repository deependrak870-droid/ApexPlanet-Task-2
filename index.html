<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

     <header>
    <h1>My Web Project</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#contact">Contact</a>
      <a href="#todo">To-Do List</a>
    </nav>
  </header>

  <main id="home">
    <h2>Welcome to My Website</h2>
    <p>HTML, CSS and JavaScript Project</p>

    <div class="container">

      <section class="card" id="contact">
        <h2>Contact Form</h2>
<form id="contactForm" novalidate>


          <label for="name">Full Name</label>
          <input type="text" id="name"
                 placeholder="Enter your name">

                 <label for="email">Email Address</label>
          <input type="email" id="email"
                 placeholder="Enter your email">

          <label for="message">Message</label>
          <textarea id="message"
                    placeholder="Write your message"></textarea>

                    <button type="submit">Submit</button>
          <p id="formResult" role="status"></p>
        </form>
      </section>

      <section class="card" id="todo">
        <h2>My To-Do List</h2>

        <div class="task-input">
          <input type="text" id="taskInput"
                 placeholder="Enter a task">
          <button id="addTask" type="button">Add</button>
        </div>

        <ul id=""tasklist"></ul>
        </section>

        </div>
        </main>

        <fotter>
            <p> 2026 My Web Project</p>
        </fotter>

        <script src=""script.js"></script>
        </body>
        </html>
